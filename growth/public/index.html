<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyniqe Growth: your AI marketing department</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1d1c1a;--muted:#6b6962;--line:#e4e1d8;--accent:#4f46c8;--accent-soft:#eeedfe;--ok:#0f6e56;--ok-soft:#e1f5ee;--warn:#854f0b;--warn-soft:#faeeda;--bad:#a32d2d;--bad-soft:#fcebeb;--radius:10px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--accent)}button,select,input,textarea{font:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:#17161f;color:#e9e8f2;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{font-weight:600;font-size:16px;letter-spacing:.2px}.brand small{display:block;font-weight:400;color:#a8a6b8;font-size:12px}
aside select{width:100%;background:#24232e;color:#fff;border:1px solid #393848;border-radius:8px;padding:7px}
nav{display:flex;flex-direction:column;gap:2px}nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:7px;color:#cfcde0;display:flex;justify-content:space-between}
nav button:hover{background:#24232e}nav button.on{background:#312f45;color:#fff}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500}
nav .pill{background:#4f46c8;color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:#8e8ca0}.side-foot button{all:unset;cursor:pointer;color:#b9b7cc;text-decoration:underline}
main{padding:22px 28px 60px;max-width:1240px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{margin:0;font-size:21px;font-weight:600}.top .sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#ebe9e2;border-radius:9px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}.btn:hover{border-color:#c9c5b8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#4038b0}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--bad)}.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}.card h3{font-size:14px;margin:0 0 6px;font-weight:600}
.kpi .n{font-size:26px;font-weight:600}.kpi .l{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:#f0eee7;color:#5f5e5a;margin-right:4px}
.s-pending_approval,.s-changes_requested{background:var(--warn-soft);color:var(--warn)}.s-published,.s-done,.s-approved{background:var(--ok-soft);color:var(--ok)}.s-rejected{background:var(--bad-soft);color:var(--bad)}
.r-high{background:var(--bad-soft);color:var(--bad)}.r-medium{background:var(--warn-soft);color:var(--warn)}.r-low{background:var(--ok-soft);color:var(--ok)}
.g-A{background:var(--ok-soft);color:var(--ok)}.g-B{background:var(--warn-soft);color:var(--warn)}.g-C{background:#f0eee7;color:#5f5e5a}
.verdict{font-size:20px;font-weight:600}.v-Healthy{color:var(--ok)}.v-Needs.work{color:var(--warn)}.v-Leaking{color:var(--bad)}
.score{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:600;border:7px solid}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .t{font-weight:600}
.flag{color:var(--bad);font-size:12.5px;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.day h3{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.mini{border:1px solid var(--line);border-left:4px solid #c9c5b8;border-radius:8px;padding:8px 9px;background:#fff;margin-bottom:8px;cursor:pointer;font-size:13px}
.mini:hover{border-color:#bdb8aa}.mini.st-published,.mini.st-done,.mini.st-approved{border-left-color:var(--ok)}.mini.st-pending_approval,.mini.st-changes_requested{border-left-color:#d38b1b}.mini.st-rejected{border-left-color:var(--bad)}
.mini .who{color:var(--muted);font-size:12px}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:500}
.md h1{font-size:18px;margin:4px 0 10px}.md h2{font-size:15px;margin:14px 0 6px}.md h3{font-size:14px;margin:12px 0 4px}.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:20px}.md blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--line);color:var(--muted)}
.md{white-space:normal}
.modal-bg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;position:relative}
.modal .x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=url],select.in,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:#1d1c1a;color:#fff;padding:10px 14px;border-radius:9px;z-index:30;max-width:420px}
.toast.err{background:var(--bad)}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--accent-soft);color:#3c3489}
.empty{color:var(--muted);text-align:center;padding:26px}
.finding{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px}.d-pass{background:var(--ok)}.d-critical{background:var(--bad)}.d-warning{background:#d38b1b}.d-info{background:#888780}
.hash{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.g4,.g3,.g2,.cal{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Hyniqe Growth<small>Your AI marketing department</small></div>
    <select id="company" aria-label="Company"></select>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="writer"></div>
      <div style="margin-top:6px"><button id="newCo">+ New company</button> · <button id="reset">Reset demo</button></div>
      <div style="margin-top:6px">Open source · AGPL-3.0 · part of Hyniqe</div>
    </div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script>
const S = { meta: null, companies: [], c: null, page: 'overview', as: 'owner' };
const PAGES = [
  ['overview', 'Overview'], ['health', 'Health check'], ['week', 'This week'], ['approvals', 'Approvals'],
  ['leads', 'Leads'], ['reports', 'Reports'], ['brand', 'Brand brain'], ['team', 'Team'], ['agents', 'Agents'], ['activity', 'Activity log'],
];
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const nice = (s) => String(s).replace(/_/g, ' ');

async function api(path, opts = {}) {
  const res = await fetch(path, { method: opts.method || 'GET', headers: { 'content-type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800);
}
async function act(fn, ok) {
  try { const r = await fn(); if (r && r.id && r.tasks) S.c = r; if (ok) toast(ok); await refreshList(); render(); return r; }
  catch (e) { toast(e.message, true); }
}

function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const l of lines) {
    let m;
    if ((m = l.match(/^(#{1,3}) (.*)/))) { close(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-•] (.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+\. (.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^&gt; ?(.*)/))) { close(); out += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!l.trim()) { close(); }
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return `<div class="md">${out}</div>`;
}

const agentOf = (id) => S.meta.agents.find((a) => a.id === id) || { name: id, title: id };
function person(id) {
  if (id === 'owner') return `${S.c.owner.name} (owner)`;
  if (id === 'auto') return 'Auto-approved';
  const m = S.c.team.find((x) => x.id === id); return m ? m.name : id;
}
const open = (t) => t.status === 'pending_approval' || t.status === 'changes_requested';
const mine = (t) => open(t) && (S.as === 'owner' ? true : t.approver === S.as);
const weekTasks = () => S.c.tasks.filter((t) => t.week === S.c.week);

async function refreshList() { S.companies = await api('/api/companies'); }
async function load(id) { S.c = await api('/api/companies/' + id); if (S.as !== 'owner' && !S.c.team.some((m) => m.id === S.as)) S.as = 'owner'; }

function renderSide() {
  $('#company').innerHTML = S.companies.map((c) => `<option value="${c.id}" ${S.c && c.id === S.c.id ? 'selected' : ''}>${esc(c.name)} · ${c.mode === 'autopilot' ? 'Autopilot' : 'Copilot'}</option>`).join('');
  const pend = S.c ? S.c.tasks.filter(mine).length : 0;
  const newLeads = S.c ? S.c.leads.filter((l) => l.status === 'new').length : 0;
  $('#nav').innerHTML = PAGES.map(([k, l]) => `<button class="${S.page === k ? 'on' : ''}" data-page="${k}">${l}${k === 'approvals' && pend ? `<span class="pill">${pend}</span>` : ''}${k === 'leads' && newLeads ? `<span class="pill">${newLeads}</span>` : ''}</button>`).join('');
  $('#writer').textContent = S.meta.claude ? 'Agents write with Claude' : 'Demo writers (no API key)';
}

function topBar(title, sub) {
  const c = S.c;
  const people = [['owner', `${c.owner.name} (owner)`], ...c.team.map((m) => [m.id, `${m.name} · ${m.role}`])];
  const weekBtn = c.weekState === 'running'
    ? `<button class="btn" data-act="close-week">Close week ${c.week} &amp; write report</button>`
    : `<button class="btn primary" data-act="start-week">Run week ${c.weekState === 'closed' ? c.week + 1 : c.week}</button>`;
  return `<div class="top"><div><h1>${esc(title)}</h1><div class="sub">${sub || ''}</div></div>
  <div class="row">
    <div class="seg" title="How this company uses the agents">
      <button data-mode="autopilot" class="${c.mode === 'autopilot' ? 'on' : ''}">Autopilot</button>
      <button data-mode="copilot" class="${c.mode === 'copilot' ? 'on' : ''}">Copilot</button>
    </div>
    ${c.mode === 'copilot' ? `<select class="in" id="as" style="width:auto" aria-label="Acting as">${people.map(([id, n]) => `<option value="${id}" ${S.as === id ? 'selected' : ''}>Acting as ${esc(n)}</option>`).join('')}</select>` : ''}
    ${weekBtn}
  </div></div>`;
}

function kpi(n, l) { return `<div class="card kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

function pageOverview() {
  const c = S.c, wt = weekTasks(), m = S.meta.modes[c.mode];
  const pub = wt.filter((t) => t.status === 'published').length;
  const pend = c.tasks.filter(mine).length;
  const a = c.leads.filter((l) => l.grade === 'A').length;
  const fast = c.leads.filter((l) => l.firstResponseMinutes !== undefined && l.firstResponseMinutes <= 5).length;
  const todo = [];
  if (!c.health) todo.push(['Run a marketing health check on your website', 'health']);
  else if (c.health.verdict !== 'Healthy') todo.push([`Fix the website: ${c.health.findings.filter((f) => !f.passed && f.severity === 'critical').length} critical leak(s)`, 'health']);
  if (c.weekState !== 'running') todo.push([`Run week ${c.weekState === 'closed' ? c.week + 1 : c.week}: the agents plan and draft everything`, 'start']);
  if (pend) todo.push([`${pend} item(s) are waiting for ${S.as === 'owner' ? 'approval' : 'your review'}`, 'approvals']);
  const nl = c.leads.filter((l) => l.status === 'new' && l.score > 0).length;
  if (nl) todo.push([`${nl} lead(s) need a reply`, 'leads']);
  if (c.weekState === 'running' && !pend) todo.push(['Everything is approved. Close the week to get the Friday report', 'close']);
  const roster = S.meta.agents.map((ag) => {
    const n = wt.filter((t) => t.agent === ag.id).length;
    return `<div style="display:flex;gap:8px;align-items:flex-start"><div class="av">${ag.name[0]}</div><div><div><b>${esc(ag.name)}</b> <span class="muted small">${esc(ag.title)}</span></div><div class="small muted">${n ? `${n} item(s) this week` : 'Idle this week'}</div></div></div>`;
  }).join('');
  return topBar(c.name, `${esc(c.industry)} · week ${c.week} · ${c.weekState === 'running' ? 'in progress' : c.weekState === 'closed' ? 'closed' : 'not started'}`) +
    `<div class="banner"><b>${m.label}</b>: ${esc(m.forWho)}. ${esc(m.howItWorks)}${c.mode === 'autopilot' ? ` Trust level: <b>${esc(S.meta.trust[c.trust].label)}</b>. ${esc(S.meta.trust[c.trust].description)}` : ''}</div>
    <div class="grid g4">${kpi(c.health ? c.health.score : '–', 'Website health score')}${kpi(pend, 'Waiting for approval')}${kpi(pub, 'Published this week')}${kpi(`${c.leads.length}<span class="muted small"> · ${a} A-grade</span>`, `Leads · ${fast} answered in 5 min`)}</div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h2>What to do next</h2><div class="list">${todo.length ? todo.map(([t, go]) => `<div class="item row" style="justify-content:space-between"><span>${esc(t)}</span><button class="btn sm" data-go="${go}">Go</button></div>`).join('') : '<div class="empty">All caught up.</div>'}</div>
        ${c.plan && c.plan.week === c.week ? `<h3 style="margin-top:16px">This week's goal</h3><div>${esc(c.plan.goal)}</div><ul class="small">${c.plan.focus.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
      </div>
      <div class="card"><h2>Your marketing team</h2><div class="grid g2" style="gap:12px">${roster}</div></div>
    </div>`;
}

function pageHealth() {
  const c = S.c, h = c.health;
  const col = h ? (h.verdict === 'Healthy' ? 'var(--ok)' : h.verdict === 'Needs work' ? '#d38b1b' : 'var(--bad)') : '#ccc';
  const findings = h ? [...h.findings].sort((x, y) => (x.passed - y.passed) || ['critical', 'warning', 'info'].indexOf(x.severity) - ['critical', 'warning', 'info'].indexOf(y.severity)) : [];
  return topBar('Marketing health check', 'Scan your website → a plain verdict → a fix for every leak, each handed to the agent who fixes it. It only reads the page.') +
    `<div class="card"><div class="row"><input type="url" id="hcUrl" placeholder="https://yourcompany.com" value="${esc(c.website)}" style="flex:1;min-width:240px"><button class="btn primary" data-act="health">Check website</button></div>
    <details style="margin-top:8px"><summary class="small muted">Or paste the page HTML (for sites behind a login or a firewall)</summary><textarea id="hcHtml" placeholder="<html>…"></textarea></details></div>
    ${h ? `<div class="card" style="margin-top:14px"><div class="row" style="gap:18px"><div class="score" style="border-color:${col};color:${col}">${h.score}</div>
      <div><div class="verdict" style="color:${col}">${esc(h.verdict)}</div><div>${esc(h.summary)}</div><div class="small muted">${esc(h.url)} · ${new Date(h.at).toLocaleString()}</div></div></div></div>
      <div class="card" style="margin-top:14px"><h2>Findings</h2>${findings.map((f) => `<div class="finding"><span class="dot ${f.passed ? 'd-pass' : 'd-' + f.severity}"></span>
      <div><div><b>${esc(f.title)}</b> <span class="tag">${esc(f.category)}</span>${f.passed ? '' : `<span class="tag">${esc(f.severity)}</span>`}</div><div class="small muted">${esc(f.evidence)}</div>${f.passed ? '' : `<div class="small" style="margin-top:3px">Fix: ${esc(f.fix)}</div>`}</div>
      <div class="small muted">${f.passed ? 'OK' : esc(agentOf(f.agent).name) + ' fixes'}</div></div>`).join('')}</div>` : '<div class="empty">No health check yet.</div>'}`;
}

function miniCard(t) {
  const a = agentOf(t.agent);
  return `<div class="mini st-${t.status}" data-task="${t.id}"><div><b>${esc(t.title)}</b></div><div class="who">${esc(a.name)} · ${esc(t.channel)} · <span class="tag s-${t.status}">${nice(t.status)}</span>${t.flags.length ? ' <span class="tag r-high">flagged</span>' : ''}</div></div>`;
}

function pageWeek() {
  const c = S.c, wt = weekTasks();
  if (!wt.length) return topBar(`Week ${c.week}`, '') + `<div class="card empty">The agents haven't started this week. Press <b>Run week</b>: the Marketing Lead plans, and every specialist drafts its work.</div>`;
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  const p = c.plan;
  return topBar(`Week ${c.week}`, `${wt.length} items · ${wt.filter((t) => t.status === 'published').length} published · ${wt.filter(open).length} waiting`) +
    (p ? `<div class="card" style="margin-bottom:14px"><h2>Plan from ${esc(agentOf('marketing-lead').name)}, Head of Marketing</h2><div><b>Goal:</b> ${esc(p.goal)}</div><ul class="small">${p.focus.map((f) => `<li>${esc(f)}</li>`).join('')}</ul><div class="small">${p.assignments.map((a) => `<div><b>${esc(agentOf(a.agent).name)}</b> (${esc(agentOf(a.agent).title)}): ${esc(a.brief)}</div>`).join('')}</div></div>` : '') +
    `<div class="cal">${days.map((d) => `<div class="day"><h3>${d}</h3>${wt.filter((t) => t.day === d).map(miniCard).join('') || '<div class="small muted">—</div>'}</div>`).join('')}</div>`;
}

function taskActions(t) {
  if (!open(t)) return '';
  const canDecide = S.as === 'owner' || t.approver === S.as;
  const others = [['owner', `${S.c.owner.name} (owner)`], ...S.c.team.map((m) => [m.id, m.name])].filter(([id]) => id !== t.approver);
  return `<div class="row" style="margin-top:10px">
    ${canDecide ? `<button class="btn ok sm" data-dec="approve" data-id="${t.id}">Approve${t.action === 'internal' ? '' : ' & publish'}</button>
    <button class="btn sm" data-dec="changes" data-id="${t.id}">Request changes</button>
    <button class="btn sm" data-revise="${t.id}">Ask ${esc(agentOf(t.agent).name)} to fix</button>
    <button class="btn bad sm" data-dec="reject" data-id="${t.id}">Reject</button>` : `<span class="small muted">Waiting for ${esc(person(t.approver))}</span>`}
    ${S.c.mode === 'copilot' ? `<select class="in" data-assign="${t.id}" style="width:auto;padding:4px 8px"><option value="">Reassign to…</option>${others.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('')}</select>` : ''}
  </div>`;
}

function pageApprovals() {
  const items = S.c.tasks.filter(mine).sort((a, b) => ({ high: 0, medium: 1, low: 2 }[a.risk] - { high: 0, medium: 1, low: 2 }[b.risk]));
  const who = S.as === 'owner' ? 'everyone' : person(S.as);
  return topBar('Approvals', S.c.mode === 'autopilot' ? 'Only what is risky lands here. Everything else already ran.' : `Review queue for ${esc(who)}. The owner can see and step into every queue.`) +
    (items.length ? `<div class="list">${items.map((t) => `<div class="item"><div class="head"><div><div class="t">${esc(t.title)}</div>
      <div class="small muted">${esc(agentOf(t.agent).name)} (${esc(agentOf(t.agent).title)}) · ${esc(t.channel)} · ${t.day} · reviewer: ${esc(person(t.approver))}</div></div>
      <div><span class="tag r-${t.risk}">${t.risk} risk</span><span class="tag s-${t.status}">${nice(t.status)}</span></div></div>
      <div class="small" style="margin-top:4px">${esc(t.approvalReason)}</div>${t.flags.map((f) => `<div class="flag">⚑ ${esc(f)}</div>`).join('')}
      <details style="margin-top:6px"><summary class="small">Show the draft</summary>${md(t.body)}<button class="btn sm" data-task="${t.id}">Open, edit or comment</button></details>
      ${taskActions(t)}</div>`).join('')}</div>` : '<div class="card empty">Nothing is waiting for you.</div>');
}

function pageLeads() {
  const L = S.c.leads;
  return topBar('Leads', 'Every lead is scored, routed and gets a reply draft at once. Speed matters: reply within 5 minutes.') +
    `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div class="small muted">Forms, booking tools and ads can post leads to <code>POST /api/companies/${esc(S.c.id)}/leads</code> (directly or through n8n, Make or Zapier).</div>
    <div class="row"><button class="btn" data-act="sim-leads">Simulate this week's inbound leads</button><button class="btn" data-act="add-lead">Add a lead</button></div></div></div>` +
    (L.length ? `<div class="card"><table><thead><tr><th>Lead</th><th>Grade</th><th>Why</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody>${L.map((l) => `<tr>
      <td><b>${esc(l.name || l.email)}</b><div class="small muted">${esc(l.title)}${l.company ? ' · ' + esc(l.company) : ''}</div><div class="small">${esc(l.message)}</div></td>
      <td><span class="tag g-${l.grade}">${l.grade} · ${l.score}</span></td><td class="small">${esc(l.reasons.join(', '))}</td><td class="small">${esc(person(l.routeTo))}</td>
      <td class="small">${l.status === 'new' ? '<span class="tag s-pending_approval">needs reply</span>' : `<span class="tag s-published">${nice(l.status)}</span>${l.firstResponseMinutes !== undefined ? `<div class="muted">in ${l.firstResponseMinutes} min${l.firstResponseMinutes <= 1 && l.status === 'replied' ? ' (auto)' : ''}</div>` : ''}`}</td>
      <td>${l.status === 'new' && l.score > 0 ? `<button class="btn sm" data-lead="${l.id}">Review reply</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty">No leads yet.</div>');
}

function pageReports() {
  const R = [...S.c.reports].reverse();
  return topBar('Friday reports', 'Written by the analyst every Friday. Lessons go into the brand brain and shape next week\'s plan.') +
    (R.length ? R.map((r) => `<div class="card" style="margin-bottom:14px">${md(r.body)}</div>`).join('') : '<div class="card empty">No report yet. Run a week, then close it.</div>');
}

function pageBrand() {
  const b = S.c.brand, L = (a) => esc((a || []).join('\n'));
  return topBar('Brand brain', 'Everything the agents know about the company. Edit it and next week\'s work changes.') +
    `<div class="card"><div class="grid g2">
      <div><label>What the company does</label><input type="text" id="b_oneLiner" value="${esc(b.oneLiner)}">
      <label>Audience</label><input type="text" id="b_audience" value="${esc(b.audience)}">
      <label>Voice</label><input type="text" id="b_voice" value="${esc(b.voice)}">
      <label>Location (optional)</label><input type="text" id="b_location" value="${esc(b.location || '')}">
      <label>Customer pain points (one per line)</label><textarea id="b_painPoints">${L(b.painPoints)}</textarea></div>
      <div><label>Keywords to win (one per line)</label><textarea id="b_keywords">${L(b.keywords)}</textarea>
      <label>Channels (linkedin, instagram, facebook, x, tiktok, email, blog, reviews)</label><textarea id="b_channels" style="min-height:60px">${L(b.channels)}</textarea>
      <label>Never say (banned claims, one per line)</label><textarea id="b_bannedClaims" style="min-height:70px">${L(b.bannedClaims)}</textarea></div>
    </div>
    <label>Offers</label>${b.offers.map((o) => `<div class="small">• <b>${esc(o.name)}</b>${o.price ? ' · ' + esc(o.price) : ''}: ${esc(o.pitch)}</div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="save-brand">Save brand brain</button>
    <label style="margin:0">Weekly ad budget</label><input type="number" id="budget" value="${S.c.weeklyAdBudget}" style="width:110px"><button class="btn" data-act="save-budget">Save budget</button>
    ${S.c.mode === 'autopilot' ? `<select class="in" id="trust" style="width:auto">${Object.entries(S.meta.trust).map(([k, v]) => `<option value="${k}" ${S.c.trust === k ? 'selected' : ''}>Trust: ${v.label}</option>`).join('')}</select>` : ''}</div></div>
    <div class="card" style="margin-top:14px"><h2>What the agents have learned</h2>${b.learnings.length ? `<ul>${[...b.learnings].reverse().map((l) => `<li><span class="muted small">Week ${l.week}:</span> ${esc(l.note)}</li>`).join('')}</ul>` : '<div class="muted">Nothing yet. Lessons arrive with each Friday report and from rejected drafts.</div>'}</div>`;
}

function pageTeam() {
  const c = S.c;
  if (c.mode === 'autopilot') return topBar('Team', '') + `<div class="card"><h2>No team needed in Autopilot</h2><p>The agents do the work; ${esc(c.owner.name)} approves only risky items. If you have marketing people, switch to <b>Copilot</b> at the top: every agent's work then goes to the person who owns that area.</p></div>`;
  const ids = S.meta.agents.map((a) => a.id);
  return topBar('Team', 'Each agent has one human owner who reviews its work.') +
    `<div class="card"><table><thead><tr><th>Person</th>${ids.map((id) => `<th title="${esc(agentOf(id).title)}">${esc(agentOf(id).name)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${c.team.map((m) => `<tr><td><b>${esc(m.name)}</b><div class="small muted">${esc(m.role)}</div></td>${ids.map((id) => `<td><input type="checkbox" data-own="${m.id}" value="${id}" ${m.reviews.includes(id) ? 'checked' : ''} aria-label="${esc(m.name)} reviews ${esc(agentOf(id).name)}"></td>`).join('')}<td><button class="btn bad sm" data-rm="${m.id}">Remove</button></td></tr>`).join('')}
    </tbody></table><div class="small muted" style="margin-top:6px">Tick a box to make that person the reviewer for that agent. An agent has one owner.</div></div>
    <div class="card" style="margin-top:14px"><h2>Add a teammate</h2><div class="row"><input type="text" id="tmName" placeholder="Name" style="width:200px"><input type="text" id="tmRole" placeholder="Role, e.g. Content Lead" style="width:220px"><button class="btn primary" data-act="add-tm">Add</button></div></div>`;
}

function pageAgents() {
  return topBar('Agents', 'One Marketing Lead and ten specialists. Each covers a job on a real marketing team.') +
    `<div class="agents">${S.meta.agents.map((a) => `<div class="card"><div class="row" style="gap:10px"><div class="av">${a.name[0]}</div><div><b>${esc(a.name)}</b><div class="small muted">${esc(a.title)}</div></div></div>
    <p class="small">${esc(a.does)}</p><div class="small muted">Covers: ${esc(a.replaces)}</div>
    ${S.c.mode === 'copilot' ? `<div class="small" style="margin-top:6px">Reviewer: ${esc((S.c.team.find((m) => m.reviews.includes(a.id)) || { name: S.c.owner.name + ' (owner)' }).name)}</div>` : ''}</div>`).join('')}</div>
    <div class="card" style="margin-top:14px"><h2>Connectors</h2><table><thead><tr><th>Connector</th><th>Channels</th><th>Status</th><th>Set to go live</th></tr></thead><tbody>${S.meta.connectors.map((k) => `<tr><td>${esc(k.name)}</td><td class="small">${esc(k.channels.join(', '))}</td><td><span class="tag ${k.status === 'live' ? 's-published' : ''}">${k.status}</span></td><td class="small hash">${esc(k.env.join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
}

function pageActivity() {
  const A = [...S.c.audit].reverse().slice(0, 300);
  return topBar('Activity log', 'Every action by every agent and person, hash-chained so nothing can be edited after the fact.') +
    `<div class="card" style="margin-bottom:14px"><div class="row"><button class="btn" data-act="verify">Verify the log</button><span id="verifyOut" class="small"></span></div></div>
    <div class="card"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>${A.map((e) => `<tr><td class="small">${new Date(e.ts).toLocaleString()}</td><td class="small">${esc(e.actor.startsWith('tm_') ? person(e.actor) : e.actor)}</td><td class="small"><b>${esc(e.action)}</b></td><td class="small muted">${esc(e.details).slice(0, 160)}<div class="hash">${e.hash.slice(0, 16)}…</div></td></tr>`).join('')}</tbody></table></div>`;
}

function render() {
  if (!S.c) { $('#main').innerHTML = '<div class="empty">No company yet. Click “+ New company”.</div>'; return; }
  renderSide();
  const pages = { overview: pageOverview, health: pageHealth, week: pageWeek, approvals: pageApprovals, leads: pageLeads, reports: pageReports, brand: pageBrand, team: pageTeam, agents: pageAgents, activity: pageActivity };
  $('#main').innerHTML = pages[S.page]();
}

function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button>${html}</div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

function openTask(id) {
  const t = S.c.tasks.find((x) => x.id === id); if (!t) return;
  const a = agentOf(t.agent), editable = t.status !== 'published' && t.status !== 'done';
  const bg = modal(`<h2 style="margin:0 0 4px">${esc(t.title)}</h2>
    <div class="small muted">${esc(a.name)}, ${esc(a.title)} · ${esc(t.channel)} · ${t.day} · <span class="tag s-${t.status}">${nice(t.status)}</span><span class="tag r-${t.risk}">${t.risk} risk</span>${t.source === 'claude' ? '<span class="tag">written by Claude</span>' : ''}</div>
    <div class="small" style="margin-top:6px">${esc(t.approvalReason)} ${t.decidedBy ? `Decided by ${esc(person(t.decidedBy))}.` : ''} ${t.publishRef ? `<span class="hash">${esc(t.publishRef)}</span>${t.publishDryRun ? ' (dry run)' : ''}` : ''}</div>
    ${t.flags.map((f) => `<div class="flag">⚑ ${esc(f)}</div>`).join('')}
    ${Object.keys(t.meta).filter((k) => k !== 'flagged').length ? `<div class="small" style="margin-top:6px">${Object.entries(t.meta).filter(([k]) => k !== 'flagged').map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('')}</div>` : ''}
    <div class="card" style="margin-top:12px">${md(t.body)}</div>
    ${editable ? `<details style="margin-top:10px"><summary>Edit the copy yourself</summary><textarea id="editBody">${esc(t.body)}</textarea><button class="btn sm" id="saveEdit">Save edit (re-checks it)</button></details>` : ''}
    <h3 style="margin-top:14px">Comments</h3>${t.comments.map((x) => `<div class="small"><b>${esc(person(x.by))}</b>: ${esc(x.text)}</div>`).join('') || '<div class="small muted">None yet.</div>'}
    <div class="row" style="margin-top:6px"><input type="text" id="cmt" placeholder="Add a comment for the agent or your team" style="flex:1"><button class="btn sm" id="addCmt">Comment</button></div>
    ${taskActions(t)}`);
  const base = `/api/companies/${S.c.id}/tasks/${t.id}`;
  const done = (r) => { if (r) { bg.remove(); } };
  bg.querySelector('#saveEdit')?.addEventListener('click', async () => done(await act(() => api(base + '/edit', { method: 'POST', body: { as: S.as, body: bg.querySelector('#editBody').value } }), 'Saved and re-checked')));
  bg.querySelector('#addCmt').addEventListener('click', async () => { const text = bg.querySelector('#cmt').value; const r = await act(() => api(base + '/comment', { method: 'POST', body: { as: S.as, text } }), 'Comment added'); if (r) { bg.remove(); openTask(t.id); } });
  bindTaskButtons(bg, () => bg.remove());
}

function bindTaskButtons(root, after) {
  root.querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', async () => {
    const decision = b.dataset.dec; let comment = '';
    if (decision !== 'approve') { comment = prompt(decision === 'reject' ? 'Why reject it? (the agents learn from this)' : 'What should change?') ?? null; if (comment === null) return; }
    const r = await act(() => api(`/api/companies/${S.c.id}/tasks/${b.dataset.id}/decision`, { method: 'POST', body: { as: S.as, decision, comment } }), decision === 'approve' ? 'Approved and published' : decision === 'reject' ? 'Rejected' : 'Changes requested');
    if (r && after) after();
  }));
  root.querySelectorAll('[data-revise]').forEach((b) => b.addEventListener('click', async () => {
    const r = await act(() => api(`/api/companies/${S.c.id}/tasks/${b.dataset.revise}/revise`, { method: 'POST', body: { as: S.as } }), 'The agent revised it');
    if (r && after) after();
  }));
  root.querySelectorAll('[data-assign]').forEach((s) => s.addEventListener('change', async () => {
    if (!s.value) return;
    const r = await act(() => api(`/api/companies/${S.c.id}/tasks/${s.dataset.assign}/assign`, { method: 'POST', body: { as: S.as, to: s.value } }), 'Reassigned');
    if (r && after) after();
  }));
}

function openLead(id) {
  const l = S.c.leads.find((x) => x.id === id);
  const bg = modal(`<h2 style="margin:0 0 4px">Reply to ${esc(l.name || l.email)}</h2><div class="small muted">${esc(l.email)} · <span class="tag g-${l.grade}">${l.grade} · ${l.score}</span> · ${esc(l.reasons.join(', '))}</div>
    <blockquote class="md" style="margin-top:10px">${esc(l.message)}</blockquote><label>Reply drafted by the agents</label><textarea id="rep">${esc(l.replyDraft)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ok" id="send">Mark as sent</button><span class="small muted">In this demo, sending is recorded, not emailed. Connect an email provider to send for real.</span></div>`);
  bg.querySelector('#send').addEventListener('click', async () => { const r = await act(() => api(`/api/companies/${S.c.id}/leads/${l.id}/reply`, { method: 'POST', body: { as: S.as } }), 'Reply recorded'); if (r) bg.remove(); });
}

function newCompany() {
  const bg = modal(`<h2 style="margin:0 0 8px">Add a company</h2>
    <label>Company name</label><input type="text" id="nName"><label>Website</label><input type="url" id="nWeb" placeholder="https://">
    <label>What it does (one line)</label><input type="text" id="nOne">
    <label>Type of business</label><select class="in" id="nTpl">${S.meta.templates.map((t) => `<option value="${t.id}">${esc(t.label)}</option>`).join('')}</select>
    <label>Do you have a marketing team?</label><select class="in" id="nMode"><option value="autopilot">No: Autopilot (the agents do the work, I approve risky items)</option><option value="copilot">Yes: Copilot (the agents assist my team)</option></select>
    <div class="grid g2"><div><label>Your name</label><input type="text" id="nOwner"></div><div><label>Weekly ad budget (0 = no ads)</label><input type="number" id="nBudget" placeholder="Template default"></div></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="nGo">Create</button></div>`);
  bg.querySelector('#nGo').addEventListener('click', async () => {
    const body = { name: $('#nName', bg).value, website: $('#nWeb', bg).value, oneLiner: $('#nOne', bg).value, template: $('#nTpl', bg).value, mode: $('#nMode', bg).value, ownerName: $('#nOwner', bg).value };
    if ($('#nBudget', bg).value !== '') body.weeklyAdBudget = Number($('#nBudget', bg).value);
    if (!body.name.trim()) return toast('Give the company a name.', true);
    try { const s = await api('/api/companies', { method: 'POST', body }); await refreshList(); await load(s.id); S.page = 'brand'; bg.remove(); render(); toast('Company added. Fill in the brand brain, then run a health check.'); }
    catch (e) { toast(e.message, true); }
  });
}

function addLead() {
  const bg = modal(`<h2 style="margin:0 0 8px">Add a lead</h2><div class="grid g2"><div><label>Name</label><input type="text" id="lN"></div><div><label>Email</label><input type="email" id="lE"></div>
    <div><label>Company</label><input type="text" id="lC"></div><div><label>Job title</label><input type="text" id="lT"></div></div>
    <label>Source</label><select class="in" id="lS"><option>contact-form</option><option>demo-request</option><option>booking</option><option>ad</option><option>social</option><option>referral</option><option>newsletter</option></select>
    <label>Message</label><textarea id="lM" style="min-height:80px;font-family:inherit"></textarea><div class="row" style="margin-top:12px"><button class="btn primary" id="lGo">Add and score</button></div>`);
  bg.querySelector('#lGo').addEventListener('click', async () => {
    const body = { name: $('#lN', bg).value, email: $('#lE', bg).value, company: $('#lC', bg).value, title: $('#lT', bg).value, source: $('#lS', bg).value, message: $('#lM', bg).value };
    try { const r = await api(`/api/companies/${S.c.id}/leads`, { method: 'POST', body }); await load(S.c.id); bg.remove(); render(); toast(`Lead added: grade ${r.grade}`); } catch (e) { toast(e.message, true); }
  });
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('button,[data-task],[data-lead]'); if (!el) return;
  const d = el.dataset;
  if (d.page) { S.page = d.page; render(); window.scrollTo(0, 0); return; }
  if (d.mode) { if (d.mode !== S.c.mode) await act(() => api(`/api/companies/${S.c.id}/settings`, { method: 'POST', body: { mode: d.mode } }), `Switched to ${d.mode === 'autopilot' ? 'Autopilot' : 'Copilot'}`); return; }
  if (d.go) { if (d.go === 'start') return act(() => api(`/api/companies/${S.c.id}/week/start`, { method: 'POST' }), 'The agents planned and drafted the week'); if (d.go === 'close') return act(() => api(`/api/companies/${S.c.id}/week/close`, { method: 'POST' }), 'Friday report written'); S.page = d.go; render(); return; }
  if (d.task && !el.closest('.modal')) return openTask(d.task);
  if (d.lead) return openLead(d.lead);
  if (el.closest('.modal')) return;
  if (d.dec || d.revise) return; // handled by bindTaskButtons
  if (d.rm) { if (confirm('Remove this teammate? Their open reviews go to the owner.')) await act(() => api(`/api/companies/${S.c.id}/team/${d.rm}`, { method: 'DELETE' }), 'Teammate removed'); return; }
  switch (d.act) {
    case 'start-week': return act(() => api(`/api/companies/${S.c.id}/week/start`, { method: 'POST' }), 'The agents planned and drafted the week');
    case 'close-week': return act(() => api(`/api/companies/${S.c.id}/week/close`, { method: 'POST' }), 'Friday report written').then(() => { S.page = 'reports'; render(); });
    case 'health': { const b = e.target; b.disabled = true; b.textContent = 'Checking…'; await act(() => api(`/api/companies/${S.c.id}/health-check`, { method: 'POST', body: { url: $('#hcUrl').value, html: $('#hcHtml').value } }), 'Health check done'); return; }
    case 'sim-leads': return act(() => api(`/api/companies/${S.c.id}/leads/simulate`, { method: 'POST' }), 'Inbound leads arrived');
    case 'add-lead': return addLead();
    case 'save-brand': {
      const f = (k) => $('#b_' + k).value; const body = {}; ['oneLiner', 'audience', 'voice', 'location', 'painPoints', 'keywords', 'channels', 'bannedClaims'].forEach((k) => (body[k] = f(k)));
      return act(() => api(`/api/companies/${S.c.id}/brand`, { method: 'POST', body }), 'Brand brain saved');
    }
    case 'save-budget': return act(() => api(`/api/companies/${S.c.id}/settings`, { method: 'POST', body: { weeklyAdBudget: $('#budget').value } }), 'Budget saved');
    case 'add-tm': return act(() => api(`/api/companies/${S.c.id}/team`, { method: 'POST', body: { name: $('#tmName').value, role: $('#tmRole').value } }), 'Teammate added');
    case 'verify': { const r = await api(`/api/companies/${S.c.id}/audit/verify`); $('#verifyOut').innerHTML = r.ok ? `<span style="color:var(--ok)">✓ All ${r.count} entries intact.</span>` : `<span style="color:var(--bad)">✗ Broken at entry ${r.brokenAt}.</span>`; return; }
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'company') { await load(el.value); render(); }
  else if (el.id === 'as') { S.as = el.value; render(); }
  else if (el.id === 'trust') await act(() => api(`/api/companies/${S.c.id}/settings`, { method: 'POST', body: { trust: el.value } }), 'Trust level saved');
  else if (el.dataset.own) {
    const id = el.dataset.own; const boxes = [...document.querySelectorAll(`[data-own="${id}"]`)].filter((b) => b.checked).map((b) => b.value);
    await act(() => api(`/api/companies/${S.c.id}/team/${id}/ownership`, { method: 'POST', body: { reviews: boxes } }), 'Ownership updated');
  }
});
const mo = new MutationObserver(() => bindTaskButtons($('#main'))); mo.observe($('#main'), { childList: true });
$('#newCo').addEventListener('click', newCompany);
$('#reset').addEventListener('click', async () => { if (!confirm('Reset to the two demo companies? This deletes your changes.')) return; await api('/api/demo/reset', { method: 'POST' }); await refreshList(); await load(S.companies[0].id); S.page = 'overview'; render(); toast('Demo reset'); });

(async () => {
  try { S.meta = await api('/api/meta'); await refreshList(); if (S.companies.length) await load(S.companies[0].id); render(); }
  catch (e) { $('#main').innerHTML = `<div class="empty">Could not reach the server: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
