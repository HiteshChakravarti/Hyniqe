<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hyniqe · Payment Data Ops</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14161a; --ink-2: #4a505a; --ink-3: #7a818c;
    --line: #e4e7ec; --line-2: #eef0f3; --accent: #3b3fd8; --accent-soft: #eceefe;
    --ok: #13795b; --ok-soft: #e5f5ee; --warn: #a15c07; --warn-soft: #fdf1df;
    --bad: #b42318; --bad-soft: #fdeceb; --info: #175cd3; --info-soft: #e8f0fd;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(246,247,249,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1440px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .brand small { color: var(--ink-3); font-weight: 500; }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live .dot { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 12px; font-weight: 650; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr); gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; }
  .mission { color: var(--ink-2); margin: 0 0 16px; }
  .mission b { color: var(--ink); }
  /* KPIs */
  .kpis { display: grid; grid-template-columns: 1.6fr repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .label { color: var(--ink-3); font-size: 12px; font-weight: 550; }
  .kpi .value { font-size: 26px; font-weight: 680; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--ink-3); font-size: 12px; }
  .quality .value { display: flex; align-items: baseline; gap: 8px; }
  .quality .from { color: var(--ink-3); font-size: 18px; font-weight: 600; }
  .meter { height: 6px; background: var(--line-2); border-radius: 99px; overflow: hidden; margin-top: 8px; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width .6s; }
  .meter .before { background: #c9ccd3; } .meter .now { background: var(--ok); }
  /* Org chart */
  .org { display: grid; gap: 14px; justify-items: center; }
  .org-row { display: grid; gap: 10px; width: 100%; }
  .org-row.top { grid-template-columns: minmax(0, 300px); justify-content: center; }
  .org-row.team { grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; padding-top: 14px; }
  .org-row.team::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; border-top: 1px solid var(--line); }
  .agent { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; position: relative; min-width: 0; }
  .org-row.team .agent::before { content: ""; position: absolute; top: -15px; left: 50%; height: 14px; border-left: 1px solid var(--line); }
  .agent.board { background: var(--ink); color: #fff; border-color: var(--ink); }
  .agent.board .title { color: #b8bdc7; }
  .agent .who { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; flex: none; }
  .agent .name { font-weight: 650; }
  .agent .title { color: var(--ink-3); font-size: 12px; line-height: 1.3; }
  .agent .now { margin-top: 8px; font-size: 12px; color: var(--ink-2); min-height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .agent.working { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .budget { margin-top: 8px; font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; }
  .budget-bar { height: 4px; background: var(--line-2); border-radius: 9px; overflow: hidden; margin-top: 3px; }
  .budget-bar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .status-dot { position: absolute; top: 10px; right: 10px; }
  /* Tasks */
  .kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .col { background: var(--bg); border-radius: 8px; padding: 10px; min-height: 120px; }
  .col h3 { margin: 0 0 8px; font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; }
  .card .meta { color: var(--ink-3); font-size: 11.5px; margin-top: 3px; display: flex; gap: 6px; align-items: center; }
  .tag { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: var(--line-2); color: var(--ink-2); }
  /* Records */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  input[type=search], input[type=text], select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #fafbfc; }
  .orig { color: var(--ink-2); white-space: pre-line; max-width: 280px; }
  .fields { display: flex; flex-wrap: wrap; gap: 3px; max-width: 340px; }
  .f { font-family: var(--mono); font-size: 11px; background: var(--line-2); border-radius: 4px; padding: 1px 5px; }
  .f b { color: var(--ink-3); font-weight: 500; }
  .scroll { max-height: 520px; overflow: auto; border: 1px solid var(--line-2); border-radius: 8px; }
  .detail td { background: #fbfbfc; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  pre { margin: 0; font-family: var(--mono); font-size: 11.5px; background: #0f1115; color: #d6dae2; padding: 10px; border-radius: 8px; overflow: auto; }
  ul.ev { margin: 0; padding-left: 16px; color: var(--ink-2); font-size: 12px; }
  .conf { font-variant-numeric: tabular-nums; font-weight: 600; }
  /* Approvals */
  .ap { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .ap .subj { font-size: 13px; font-weight: 550; }
  .ap .why { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .ap .cmp { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; font-size: 12px; }
  .ap .cmp .lbl { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 7px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.reject { color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  details summary { cursor: pointer; color: var(--accent); font-size: 12px; margin-top: 6px; }
  .email { white-space: pre-wrap; font-size: 12px; background: var(--bg); border-radius: 6px; padding: 8px; margin-top: 6px; color: var(--ink-2); }
  .report p { margin: 0 0 8px; }
  .report ul { margin: 0; padding-left: 18px; color: var(--ink-2); }
  .audit { font-family: var(--mono); font-size: 11px; max-height: 320px; overflow: auto; }
  .audit div { padding: 3px 0; border-bottom: 1px dashed var(--line-2); display: grid; grid-template-columns: 38px 64px 1fr; gap: 6px; }
  .audit .h { color: var(--ink-3); }
  .rule { padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
  .rule:last-child { border-bottom: 0; }
  .gate { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .gate input { width: 100%; }
  .muted { color: var(--ink-3); }
  .empty { text-align: center; padding: 48px 16px; }
  .empty h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.02em; }
  .empty p { color: var(--ink-2); max-width: 620px; margin: 0 auto 18px; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; }
  .count { color: var(--ink-3); font-weight: 500; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(3, 1fr); } .org-row.team { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo">H</div><div>Hyniqe <small id="company-name">· Payment Data Ops</small></div></div>
    <div class="grow"></div>
    <span id="mode" class="pill"></span>
    <span id="llm" class="pill"></span>
    <span id="chain" class="pill"></span>
    <a id="export" class="pill accent" href="/api/export.csv" style="text-decoration:none">Export CSV</a>
  </div>
</header>
<main>
  <div id="snapshot-banner"></div>
  <div id="start"></div>
  <div id="app" hidden>
    <p class="mission" id="mission"></p>
    <section class="kpis" id="kpis"></section>
    <div class="grid">
      <div class="stack">
        <section class="panel"><h2>Org chart</h2><div id="org" class="org"></div></section>
        <section class="panel"><h2>Task board</h2><div id="kanban" class="kanban"></div></section>
        <section class="panel">
          <h2>Records <span class="count" id="rec-count"></span></h2>
          <div class="toolbar">
            <div class="tabs" id="tabs"></div>
            <div class="grow"></div>
            <input type="search" id="q" placeholder="Search vendor, town, country…" />
          </div>
          <div class="scroll"><table><thead><tr><th>Vendor</th><th>Before</th><th>After (ISO 20022)</th><th>Conf.</th><th>Status</th></tr></thead><tbody id="records"></tbody></table></div>
        </section>
      </div>
      <div class="stack">
        <section class="panel report"><h2>Board report</h2><div id="report"></div></section>
        <section class="panel"><h2>Your decisions <span class="count" id="ap-count"></span></h2><div id="approvals" style="max-height:620px;overflow:auto;padding-right:4px"></div></section>
        <section class="panel"><h2>Prevention rules</h2><div id="rules"></div></section>
        <section class="panel">
          <h2>Onboarding gate</h2>
          <p class="muted" style="margin:0 0 8px;font-size:12px">Check a new vendor against the rules you have activated.</p>
          <form id="gate" class="gate">
            <input name="town" type="text" placeholder="Town" />
            <input name="country" type="text" placeholder="Country (e.g. DE)" />
            <input name="postcode" type="text" placeholder="Postcode" />
            <input name="iban" type="text" placeholder="IBAN" />
            <button class="primary" style="grid-column: span 2">Check vendor</button>
          </form>
          <div id="gate-result" style="margin-top:8px;font-size:12.5px"></div>
        </section>
        <section class="panel"><h2>Audit trail</h2><div id="audit" class="audit"></div></section>
      </div>
    </div>
  </div>
</main>
<script>
(() => {
  const SNAP = window.__HYNIQE_SNAPSHOT__ || null;
  const LIVE = !SNAP;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const COLORS = { lead: '#3b3fd8', profiler: '#0e9384', repair: '#7a5af8', controls: '#c4320a', outreach: '#d4890a', rule_engineer: '#155eef' };
  const STATUS = {
    compliant: ['ok', 'Already compliant'], repaired: ['ok', 'Repaired'], in_review: ['warn', 'Needs review'],
    awaiting_data: ['bad', 'Missing data'], needs_data: ['bad', 'Missing data'], needs_repair: ['info', 'Queued'],
    repaired_pending_controls: ['info', 'In controls'], compliant_pending_controls: ['info', 'In controls'], new: ['', 'New'],
  };
  const TABS = [
    ['all', 'All'], ['repaired', 'Repaired'], ['in_review', 'Needs review'], ['missing', 'Missing data'], ['compliant', 'Already compliant'],
  ];
  const ui = { tab: 'all', q: '', open: new Set() };
  let S = SNAP;

  const statusPill = (s) => { const [k, l] = STATUS[s] || ['', s]; return `<span class="pill ${k}">${esc(l)}</span>`; };
  const fields = (a) => !a ? '<span class="muted">—</span>' : `<div class="fields">${Object.entries(a).filter(([, v]) => v && (!Array.isArray(v) || v.length)).map(([k, v]) => `<span class="f"><b>${k}</b> ${esc(Array.isArray(v) ? v.join(' / ') : v)}</span>`).join('')}</div>`;
  const fmtTime = (t) => t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';

  function renderHeader() {
    $('company-name').textContent = `· ${S.company?.name ?? 'Payment Data Ops'}`;
    $('mode').className = `pill ${LIVE ? 'ok live' : 'info'}`;
    $('mode').innerHTML = LIVE ? `<span class="dot"></span>Live · heartbeat ${S.tick}` : `Snapshot · ${new Date(S.generatedAt).toLocaleString()}`;
    $('llm').className = `pill ${S.llm ? 'accent' : ''}`;
    $('llm').textContent = S.llm ? 'Claude assist on' : 'Rules engine only';
    $('chain').className = `pill ${S.audit.ok ? 'ok' : 'bad'}`;
    $('chain').textContent = S.audit.ok ? `Audit chain verified · ${S.audit.entries}` : `Audit chain BROKEN at #${S.audit.brokenAt}`;
    $('export').hidden = !LIVE || !S.started;
  }

  function renderStart() {
    $('start').innerHTML = S.started ? '' : `<div class="panel empty">
      <h1>Your payment data team is hired and waiting</h1>
      <p>Six agents, from a Head of Payment Data Ops down to a rule engineer, will profile your vendor master, repair addresses into ISO 20022 fields, run payment controls, draft vendor outreach and propose prevention rules. Anything uncertain comes to you.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="primary" id="load-sample" ${LIVE ? '' : 'disabled'}>Hand over the sample vendor master (240 records)</button>
        <label class="pill" style="cursor:pointer">Upload your own CSV<input type="file" id="upload" accept=".csv" hidden ${LIVE ? '' : 'disabled'}></label>
      </div>
      <p class="muted" style="margin-top:14px;font-size:12px">CSV columns: vendor_id, name, and either address_text or street, building, postcode, town, country. Optional: iban, bic, owner. Use synthetic or anonymised data only.</p>
    </div>`;
    $('app').hidden = !S.started;
    if (!S.started && LIVE) {
      $('load-sample').onclick = () => post('/api/load-sample');
      $('upload').onchange = async (e) => { const f = e.target.files[0]; if (f) post('/api/upload', await f.text(), 'text/csv'); };
    }
  }

  function renderKpis() {
    const m = S.metrics;
    $('mission').innerHTML = `<b>Mission:</b> ${esc(S.company?.mission)}`;
    $('kpis').innerHTML = `
      <div class="kpi quality"><div class="label">ISO 20022 address compliance</div>
        <div class="value"><span class="from">${m.qualityBefore}%</span>→<span>${m.qualityNow}%</span></div>
        <div class="meter"><i class="now" style="width:${m.qualityNow}%"></i><i class="before" style="width:${m.qualityBefore}%"></i></div>
        <div class="sub" style="margin-top:6px">${m.compliantNow} of ${m.total} records ready</div></div>
      <div class="kpi"><div class="label">Repaired automatically</div><div class="value">${m.autoRepaired}</div><div class="sub">${m.automationRate}% of records needing work</div></div>
      <div class="kpi"><div class="label">Approved by you</div><div class="value">${m.humanApproved}</div><div class="sub">after review</div></div>
      <div class="kpi"><div class="label">Waiting for you</div><div class="value" style="color:var(--warn)">${S.approvals.filter((a) => a.status === 'pending').length}</div><div class="sub">${m.inReview} records in review</div></div>
      <div class="kpi"><div class="label">Missing vendor data</div><div class="value" style="color:var(--bad)">${m.needsData}</div><div class="sub">outreach drafted</div></div>
      <div class="kpi"><div class="label">Analyst time saved</div><div class="value">${m.hoursSaved}h</div><div class="sub">at 6 min/repair (assumption) · ${m.creditsUsed}/${m.creditsBudget} credits</div></div>`;
  }

  function agentCard(a) {
    const pct = Math.min(100, Math.round((a.spent / a.budget) * 100));
    const st = a.status === 'working' ? ['info', 'Working'] : a.status === 'out_of_budget' ? ['bad', 'Out of budget'] : ['', 'Idle'];
    return `<div class="agent ${a.status === 'working' ? 'working' : ''}">
      <span class="pill ${st[0]} status-dot" style="padding:1px 7px;font-size:10.5px">${st[1]}</span>
      <div class="who"><div class="avatar" style="background:${COLORS[a.role] || '#555'}">${esc(a.name[0])}</div>
        <div><div class="name">${esc(a.name)}</div><div class="title">${esc(a.title)}</div></div></div>
      <div class="now">${a.current_task_title ? esc(a.current_task_title) : `<span class="muted">${a.tasks_done} task${a.tasks_done === 1 ? '' : 's'} done</span>`}</div>
      <div class="budget"><span>Budget</span><span>${a.spent} / ${a.budget}</span></div>
      <div class="budget-bar"><i style="width:${pct}%;${a.status === 'out_of_budget' ? 'background:var(--bad)' : ''}"></i></div>
    </div>`;
  }

  function renderOrg() {
    const lead = S.agents.find((a) => !a.reports_to);
    const team = S.agents.filter((a) => a.reports_to);
    $('org').innerHTML = `
      <div class="org-row top"><div class="agent board"><div class="who"><div class="avatar" style="background:#fff;color:var(--ink)">You</div>
        <div><div class="name">The board</div><div class="title">Approves anything uncertain, client-facing or rule-changing</div></div></div></div></div>
      <div class="org-row top">${lead ? agentCard(lead) : ''}</div>
      <div class="org-row team">${team.map(agentCard).join('')}</div>`;
  }

  function renderKanban() {
    const cols = [['todo', 'To do'], ['in_progress', 'In progress'], ['done', 'Done']];
    $('kanban').innerHTML = cols.map(([k, l]) => {
      let list = S.tasks.filter((t) => t.status === k || (k === 'done' && t.status === 'failed'));
      const total = list.length;
      if (k === 'done') list = list.slice().reverse().slice(0, 8);
      return `<div class="col"><h3>${l}<span>${total}</span></h3>${list.map((t) => `
        <div class="card">${esc(t.title)}<div class="meta"><span class="tag">${esc(t.kind)}</span>${esc(t.assignee || S.agents.find((a) => a.role === t.role)?.name || t.role)}${t.status === 'failed' ? ' · <span style="color:var(--bad)">failed</span>' : ''}</div></div>`).join('') || '<div class="muted" style="font-size:12px">Nothing here</div>'}</div>`;
    }).join('');
  }

  function recordMatches(r) {
    const t = ui.tab;
    if (t === 'repaired' && r.status !== 'repaired') return false;
    if (t === 'in_review' && r.status !== 'in_review') return false;
    if (t === 'missing' && !['awaiting_data', 'needs_data'].includes(r.status)) return false;
    if (t === 'compliant' && r.status !== 'compliant') return false;
    if (!ui.q) return true;
    const hay = `${r.vendor} ${r.name} ${r.original} ${JSON.stringify(r.address || {})}`.toLowerCase();
    return hay.includes(ui.q.toLowerCase());
  }

  function renderRecords() {
    const counts = { all: S.records.length, repaired: 0, in_review: 0, missing: 0, compliant: 0 };
    for (const r of S.records) {
      if (r.status === 'repaired') counts.repaired++;
      if (r.status === 'in_review') counts.in_review++;
      if (r.status === 'awaiting_data' || r.status === 'needs_data') counts.missing++;
      if (r.status === 'compliant') counts.compliant++;
    }
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${ui.tab === k ? 'on' : ''}" data-tab="${k}">${l} ${counts[k]}</button>`).join('');
    const list = S.records.filter(recordMatches);
    $('rec-count').textContent = `· ${list.length} shown`;
    $('records').innerHTML = list.slice(0, 400).map((r) => {
      const open = ui.open.has(r.id);
      const conf = r.confidence == null ? '—' : `${Math.round(r.confidence * 100)}%`;
      const confColor = r.confidence == null ? 'var(--ink-3)' : r.confidence >= 0.8 ? 'var(--ok)' : r.confidence >= 0.5 ? 'var(--warn)' : 'var(--bad)';
      return `<tr class="row" data-id="${r.id}">
        <td><b>${esc(r.vendor)}</b><div class="muted">${esc(r.name)}</div></td>
        <td class="orig">${esc(r.original)}</td>
        <td>${fields(r.address)}</td>
        <td class="conf" style="color:${confColor}">${conf}</td>
        <td>${statusPill(r.status)}<div class="muted" style="font-size:11px;margin-top:3px">${esc(r.method || '')}</div></td></tr>
        ${open ? `<tr class="detail"><td colspan="5"><div class="detail-grid">
          <div><div class="muted" style="font-size:11px;margin-bottom:4px">WHY · evidence the agents recorded</div><ul class="ev">${r.evidence.map((e) => `<li>${esc(e)}</li>`).join('') || '<li>No evidence yet</li>'}</ul>
            ${r.issues.length ? `<div class="muted" style="font-size:11px;margin:8px 0 4px">ISSUES</div><ul class="ev">${r.issues.map((i) => `<li><b>${esc(i.code)}</b> (${esc(i.severity)}): ${esc(i.message)}</li>`).join('')}</ul>` : ''}
            <div class="muted" style="font-size:11px;margin-top:8px">IBAN ${esc(r.iban || '—')} · BIC ${esc(r.bic || '—')} · owner ${esc(r.owner || '—')}${r.resolvedBy ? ` · resolved by ${esc(r.resolvedBy)}` : ''}</div></div>
          <div><div class="muted" style="font-size:11px;margin-bottom:4px">pacs.008 PstlAdr</div><pre>${esc(r.xml || 'Not structured yet')}</pre></div>
        </div></td></tr>` : ''}`;
    }).join('') || '<tr><td colspan="5" class="muted" style="padding:20px;text-align:center">No records match</td></tr>';
  }

  function renderReport() {
    const r = S.company?.report;
    $('report').innerHTML = r ? `<p>${esc(r.summary)}</p><ul>${r.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Written by Orin at ${fmtTime(r.generatedAt)}</div>` : '<span class="muted">Orin writes this once the first pass is finished.</span>';
  }

  const KIND = { record_review: ['warn', 'Record review'], outreach_send: ['info', 'Send outreach'], rule_activation: ['accent', 'Activate rule'], budget_increase: ['bad', 'Budget'] };
  function renderApprovals() {
    const pending = S.approvals.filter((a) => a.status === 'pending');
    $('ap-count').textContent = `· ${pending.length} pending`;
    const order = { budget_increase: 0, rule_activation: 1, outreach_send: 2, record_review: 3 };
    pending.sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
    $('approvals').innerHTML = pending.slice(0, 40).map((a) => {
      const [k, l] = KIND[a.kind] || ['', a.kind];
      let body = '';
      if (a.kind === 'record_review') {
        body = `<div class="cmp"><div><div class="lbl">Original</div>${esc(a.payload.original)}</div><div><div class="lbl">Proposed</div>${fields(a.payload.suggested)}</div></div>`;
      } else if (a.kind === 'outreach_send') {
        const o = S.outreach.find((x) => x.id === a.payload.outreachId);
        body = o ? `<details><summary>Read the draft email</summary><div class="email"><b>${esc(o.subject)}</b>\n\n${esc(o.body)}</div></details>` : '';
      } else if (a.kind === 'rule_activation') {
        const r = S.rules.find((x) => x.id === a.payload.ruleId);
        body = r ? `<div class="why">${esc(r.rationale)}</div>` : '';
      }
      return `<div class="ap"><span class="pill ${k}" style="font-size:11px">${l}</span> <span class="muted" style="font-size:11.5px">from ${esc(a.requested_by)}</span>
        <div class="subj" style="margin-top:6px">${esc(a.subject)}</div>${body}
        <div class="actions"><button class="approve" data-ap="${a.id}" data-d="approved" ${LIVE ? '' : 'disabled'}>Approve</button>
        <button class="reject" data-ap="${a.id}" data-d="rejected" ${LIVE ? '' : 'disabled'}>Reject</button></div></div>`;
    }).join('') + (pending.length > 40 ? `<div class="muted">+ ${pending.length - 40} more</div>` : '') || '<span class="muted">Nothing needs you right now.</span>';
  }

  function renderRules() {
    $('rules').innerHTML = S.rules.map((r) => `<div class="rule"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.code)}</b>
      <span class="pill ${r.status === 'active' ? 'ok' : r.status === 'rejected' ? 'bad' : 'warn'}" style="font-size:11px">${esc(r.status)}</span></div>
      <div>${esc(r.title)}</div><div class="muted" style="font-size:11.5px">Seen ${r.evidence_count}× · proposed by ${esc(r.proposed_by)}</div></div>`).join('')
      || '<span class="muted">Dex proposes rules once repairs are done.</span>';
  }

  function renderAudit() {
    $('audit').innerHTML = S.audit.tail.slice(0, 80).map((a) => `<div><span class="h">#${a.seq}</span><span>${esc(a.actor)}</span>
      <span>${esc(a.action)} <span class="h">${esc(a.entity_id || '')} · ${esc(String(a.hash).slice(0, 10))}</span></span></div>`).join('');
  }

  function render() {
    renderHeader();
    renderStart();
    if (!S.started) return;
    renderKpis(); renderOrg(); renderKanban(); renderRecords(); renderReport(); renderApprovals(); renderRules(); renderAudit();
  }

  async function post(path, body, type = 'application/json') {
    if (!LIVE) return;
    const res = await fetch(path, { method: 'POST', headers: { 'content-type': type }, body: typeof body === 'string' ? body : JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) alert(data.error || 'Request failed');
    await refresh();
    return data;
  }

  async function refresh() {
    if (!LIVE) return;
    try { S = await (await fetch('/api/state')).json(); render(); } catch (e) { console.warn(e); }
  }

  document.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { ui.tab = tab.dataset.tab; renderRecords(); return; }
    const ap = e.target.closest('[data-ap]');
    if (ap) { post(`/api/approvals/${ap.dataset.ap}`, { decision: ap.dataset.d, by: 'board' }); return; }
    const row = e.target.closest('tr.row');
    if (row) { const id = row.dataset.id; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); renderRecords(); }
  });
  $('q').addEventListener('input', (e) => { ui.q = e.target.value; renderRecords(); });
  $('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const row = Object.fromEntries(new FormData(e.target).entries());
    if (!LIVE) { $('gate-result').innerHTML = '<span class="muted">Run the engine locally (npm start) to try the gate.</span>'; return; }
    const res = await (await fetch('/api/validate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(row) })).json();
    $('gate-result').innerHTML = res.accepted
      ? `<span class="pill ok">Accepted</span> <span class="muted">${S.rules.filter((r) => r.status === 'active').length ? 'passes every active rule' : 'no rules are active yet: approve some first'}</span>`
      : `<span class="pill bad">Blocked</span><ul class="ev" style="margin-top:6px">${res.violations.map((v) => `<li><b>${esc(v.rule)}</b> ${esc(v.message)}</li>`).join('')}</ul>`;
  });

  if (SNAP) {
    $('snapshot-banner').innerHTML = '<div class="banner">Read-only snapshot of a completed run. Approvals, uploads and the onboarding gate work in the live version: <code>npm start</code>.</div>';
    render();
  } else {
    refresh();
    setInterval(refresh, 900);
  }
})();
</script>
</body>
</html>
