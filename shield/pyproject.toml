[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyniqe-shield"
version = "0.1.0"
description = "Check AI agent add-ons (skills, MCP servers and configs, n8n workflows) for hidden instructions, data theft and risky permissions."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
keywords = ["ai-security", "mcp", "agent-security", "prompt-injection", "owasp", "llm"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "License :: OSI Approved :: GNU Affero General Public License v3"]

[project.scripts]
hyniqe-shield = "hyniqe_shield.cli:main"

[project.urls]
Homepage = "https://github.com/HiteshChakravarti/Hyniqe"

[tool.setuptools]
packages = ["hyniqe_shield"]

[tool.setuptools.package-data]
hyniqe_shield = ["rules.json"]
